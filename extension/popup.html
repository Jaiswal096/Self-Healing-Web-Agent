<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoHeal Agent</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg class="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
        <span class="logo-text">AutoHeal</span>
      </div>
      <div class="status-indicator">
        <div class="status-dot" id="auth-status-dot"></div>
        <span class="status-text" id="auth-status-text">Checking...</span>
      </div>
    </header>

    <main class="main-content">
      <div class="current-url-container">
        <span class="label">Current Tab</span>
        <div class="url-display" id="current-url" title="Loading URL...">Loading...</div>
      </div>
      
      <button id="monitor-btn" class="btn-primary" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20V10"></path>
          <path d="M18 20V4"></path>
          <path d="M6 20v-4"></path>
        </svg>
        <span>Monitor This Page</span>
      </button>

      <div id="action-feedback" class="feedback hidden"></div>
    </main>

    <footer class="footer">
      <a href="http://localhost:5173" target="_blank" class="link-dashboard">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="9" x="3" y="3" rx="1"></rect>
          <rect width="7" height="5" x="14" y="3" rx="1"></rect>
          <rect width="7" height="9" x="14" y="12" rx="1"></rect>
          <rect width="7" height="5" x="3" y="16" rx="1"></rect>
        </svg>
        Open Dashboard
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
